# Paths are relative to this file. Add more build_N and run_N entries after
# building more personalities; config 1 is the complete default scan.
[scan]
object_dirs =
    ../build/build_1
binary_paths =
    ../run/run_1/bin/httpd
exclude =
    # Static archives duplicate the standalone objects scanned here.
    *.a
    */.libs/*
    */CMakeFiles/*/CompilerIdC/*
    */CMakeFiles/CMakeScratch/*
    # These generated/platform stubs contain data or sanitizer constructors,
    # but no Apache target code on the pinned Linux build.
    modules.o
    */exports.o
    */util_charset.o
    */util_ebcdic.o
    */srclib/apr/atomic/unix/ia32.o
    */srclib/apr/atomic/unix/mutex.o
    */srclib/apr/atomic/unix/mutex64.o
    */srclib/apr/atomic/unix/ppc.o
    */srclib/apr/atomic/unix/s390.o
    */srclib/apr/atomic/unix/solaris.o
    */srclib/apr/poll/unix/kqueue.o
    */srclib/apr/poll/unix/port.o
    */srclib/apr/poll/unix/z_asio.o
    */srclib/apr-util/crypto/apr_crypto.o
    */srclib/apr-util/ldap/apr_ldap_stub.o
    */srclib/apr-util/ldap/apr_ldap_url.o

[checks]
# Ordinary -fstack-protector legitimately emits no canary for leaf functions
# without qualifying stack objects. Check it once on the final target instead
# of requiring a reference from every object.
stack_protector = ignore
fortify = ignore
asan = present
ubsan = present
tsan = ignore
msan = ignore
sancov = present
sancov_cmp = ignore
sancov_pc_table = ignore
llvm_profile = present
source_coverage = present
libfuzzer = ignore

# Only the installed server owns the fuzzer driver. Apache helper programs,
# individual objects, and static-library members do not need to define it.
[checks:../run/run_1/bin/httpd]
stack_protector = present
ubsan = ignore
sancov_cmp = ignore
libfuzzer = present

# These real objects contain ASan, guard, and source coverage instrumentation,
# but their operations do not require a UBSan callback.
[checks:../build/build_1/buildmark.o]
ubsan = ignore

[checks:../build/build_1/modules/dav/main/providers.o]
ubsan = ignore

[checks:../build/build_1/srclib/apr-util/buckets/apr_buckets.o]
ubsan = ignore

# The guard bridge and harness must not instrument their own coverage callback.
[checks:../build/build_1/modules/fuzzer/*.o]
sancov = ignore

[output]
report = ../logs/symbolReport.md
